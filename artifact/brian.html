<title>Brian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: fixed 260px chat list on the left, thread + composer on the right; sidebar becomes a drawer under 760px.
     Single deliberate dark theme, per the Brian spec. */
  :root {
    --bg: #0B1A13;
    --surface: #11261C;
    --surface-2: #173527;
    --accent: #2E8B57;
    --accent-light: #7CE3A6;
    --text: #E6F2EA;
    --text-muted: #8FB3A0;
    --border: rgba(124, 227, 166, 0.12);
    --danger: #E58C8C;
    --danger-bg: rgba(229, 140, 140, 0.08);
    --danger-border: rgba(229, 140, 140, 0.35);
    --scrim: rgba(0, 0, 0, 0.5);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --sidebar-w: 260px;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--font);
    display: flex;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-block: 16px;
    padding-left: var(--gutter-l);
    padding-right: 12px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 6px 8px;
    font-size: 20px; font-weight: 650; color: var(--accent-light);
  }
  .brand svg { width: 32px; height: 32px; }
  .new-chat {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: 600;
    text-align: left;
  }
  .new-chat:hover { filter: brightness(1.1); }
  .chat-list {
    list-style: none; margin: 0; padding: 0;
    overflow-y: auto; flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .chat-item {
    display: flex; align-items: center; gap: 4px;
    border-radius: 10px;
    border: 1px solid transparent;
    min-height: 40px;
  }
  .chat-item:hover { background: rgba(124, 227, 166, 0.06); }
  .chat-item.active { background: var(--surface-2); border-color: var(--border); }
  .chat-item .open {
    flex: 1; min-width: 0;
    background: none; border: none;
    padding: 9px 10px;
    text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text);
  }
  .chat-item .delete {
    background: none; border: none;
    padding: 6px 8px; margin-right: 4px;
    color: var(--text-muted);
    border-radius: 8px;
    opacity: 0;
    display: flex;
  }
  .chat-item:hover .delete, .chat-item.active .delete, .chat-item .delete:focus-visible { opacity: 1; }
  .chat-item .delete:hover { color: var(--danger); }
  .chat-item .delete svg { width: 16px; height: 16px; }
  .chat-item.confirming { background: var(--danger-bg); border-color: var(--danger-border); }
  .confirm-label { flex: 1; min-width: 0; padding: 0 10px; font-size: 13px; }
  .confirm-btn {
    border: none; border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: 600;
    background: transparent; color: var(--text-muted);
  }
  .confirm-btn.yes { background: var(--danger); color: var(--bg); margin-right: 2px; }
  .empty-list { color: var(--text-muted); font-size: 13px; padding: 6px 10px; }
  .store-note { color: var(--text-muted); font-size: 12px; padding: 0 6px; }

  /* Main panel */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: none;
    align-items: center; gap: 10px;
    padding-block: 10px;
    padding-left: var(--gutter-l);
    padding-right: var(--gutter-r);
    border-bottom: 1px solid var(--border);
  }
  .menu-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 8px; display: flex;
  }
  .menu-btn svg { width: 20px; height: 20px; }
  .topbar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  .thread {
    flex: 1; overflow-y: auto;
    padding-block: 24px;
    padding-left: 16px;
    padding-right: var(--gutter-r);
  }
  .thread-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .msg { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  .msg.user { justify-content: flex-end; }
  .avatar { width: 30px; height: 30px; flex-shrink: 0; margin-top: 2px; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    max-width: min(620px, 85%);
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--accent); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.error .bubble {
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
  }
  .thinking { color: var(--text-muted); }
  .cursor {
    display: inline-block;
    width: 8px; height: 1.05em;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: var(--accent-light);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

  .empty-state {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 8px;
    padding-block: 24px;
    padding-left: var(--gutter-l);
    padding-right: var(--gutter-r);
  }
  .empty-state svg { width: 72px; height: 72px; margin-bottom: 8px; }
  .empty-state h1 { margin: 0; font-size: 26px; font-weight: 650; text-wrap: balance; }
  .empty-state p { margin: 0; color: var(--text-muted); max-width: 46ch; }

  /* Composer */
  .composer {
    padding-block: 12px 18px;
    padding-left: 16px;
    padding-right: var(--gutter-r);
  }
  .composer-inner {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
  }
  .composer-inner:focus-within { border-color: var(--accent-light); }
  textarea {
    flex: 1; min-width: 0;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text);
    font: inherit;
    padding: 6px 8px;
    max-height: 200px;
    outline: none;
  }
  textarea::placeholder { color: var(--text-muted); }
  textarea:disabled { cursor: not-allowed; }
  .send, .stop {
    border: none; border-radius: 10px;
    padding: 8px 14px; font-weight: 600;
  }
  .send { background: var(--accent); }
  .send:disabled { opacity: 0.45; cursor: not-allowed; }
  .stop { background: transparent; border: 1px solid var(--accent-light); color: var(--accent-light); }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--text-muted); text-align: center; }
  .notice {
    max-width: 760px; margin: 0 auto 8px;
    padding: 8px 12px; border-radius: 10px; font-size: 13px;
    background: var(--danger-bg); border: 1px solid var(--danger-border);
  }

  .scrim { display: none; }

  @media (max-width: 760px) {
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 20;
      padding-top: max(16px, env(safe-area-inset-top, 0px));
      padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    body.sidebar-open .sidebar { transform: none; }
    body.sidebar-open .scrim {
      display: block; position: fixed; inset: 0; z-index: 10;
      background: var(--scrim);
    }
    .topbar { display: flex; }
    .thread { padding-block: 16px; padding-left: var(--gutter-l); }
    .composer { padding-block: 8px 12px; padding-left: var(--gutter-l); }
    .chat-item .delete { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
</style>

<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="logo-slot"></span>Brian</div>
  <button class="new-chat" id="newChat">+ New chat</button>
  <ul class="chat-list" id="chatList"><li class="empty-list">Loading chats…</li></ul>
  <div class="store-note" id="storeNote"></div>
</aside>
<div class="scrim" id="scrim"></div>

<main class="main">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open chat list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="title" id="topTitle">Brian</span>
  </div>

  <div class="thread" id="thread" hidden>
    <div class="thread-inner" id="threadInner"></div>
  </div>
  <div class="empty-state" id="emptyState">
    <span class="logo-slot"></span>
    <h1>Hi, I'm Brian</h1>
    <p>Ask me anything. Press Enter to send, Shift+Enter for a new line.</p>
  </div>

  <form class="composer" id="composer">
    <div class="notice" id="notice" role="status" hidden></div>
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="Message Brian…" aria-label="Message"></textarea>
      <button type="submit" class="send" id="sendBtn" disabled>Send</button>
      <button type="button" class="stop" id="stopBtn" hidden>Stop</button>
    </div>
    <div class="hint">Brian answers with your own Claude account. The first message asks you to allow that.</div>
  </form>
</main>

<script>
(() => {
  "use strict";

  // Brian as a Claude Artifact. There is no backend and no API key: replies come from the
  // `sample` capability on the viewer's own Claude account, and chats are kept in the viewer's
  // private `data/users/<id>` space (`db`), or in this browser when that is not available.
  const MODEL = "claude-sonnet-5-5";
  const RULES = "You are Brian, a helpful assistant. Reply in plain text without Markdown formatting.";
  const LOCAL_KEY = "brian.chats";
  const MAX_INPUT_CHARS = 200000;   // the platform caps input at 256 KiB; older turns are dropped first
  const PERMANENT_ERRORS = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);

  const LOGO_SVG = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path fill="#7CE3A6" d="M31 10C24 8 17 11 15 17C10 18 7 23 8 28C5 31 5 37 8 40C7 46 11 51 17 52C20 56 26 57 31 54Z"/>
    <path fill="#2E8B57" d="M33 10C40 8 47 11 49 17C54 18 57 23 56 28C59 31 59 37 56 40C57 46 53 51 47 52C44 56 38 57 33 54Z"/>
    <g fill="none" stroke="#0B1A13" stroke-width="2.5" stroke-linecap="round">
      <path d="M24 17C20 19 20 24 23 26"/><path d="M14 30C18 30 21 33 21 37"/>
      <path d="M25 34C28 36 28 41 25 44"/><path d="M16 44C19 43 22 45 23 48"/>
      <path d="M40 17C44 19 44 24 41 26"/><path d="M50 30C46 30 43 33 43 37"/>
      <path d="M39 34C36 36 36 41 39 44"/><path d="M48 44C45 43 42 45 41 48"/>
    </g>
  </svg>`;

  const TRASH_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>`;

  const $ = (id) => document.getElementById(id);
  const els = {
    chatList: $("chatList"), newChat: $("newChat"), thread: $("thread"),
    threadInner: $("threadInner"), emptyState: $("emptyState"), composer: $("composer"),
    input: $("input"), sendBtn: $("sendBtn"), stopBtn: $("stopBtn"), notice: $("notice"),
    menuBtn: $("menuBtn"), scrim: $("scrim"), topTitle: $("topTitle"), storeNote: $("storeNote"),
  };

  document.querySelectorAll(".logo-slot").forEach((el) => { el.innerHTML = LOGO_SVG; });

  const use = (name) => (window.claude && typeof window.claude.use === "function")
    ? window.claude.use(name).catch(() => null)
    : Promise.resolve(null);

  // ---------- Chat storage ----------
  function cleanChat(c) {
    if (!c || typeof c.id !== "string" || !Array.isArray(c.messages)) return null;
    return {
      id: c.id,
      title: typeof c.title === "string" && c.title ? c.title : "Untitled chat",
      createdAt: Number(c.createdAt) || 0,
      messages: c.messages
        .filter((m) => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string" && m.content)
        .map((m) => ({ role: m.role, content: m.content })),
    };
  }

  function localStore() {
    const read = () => {
      try {
        const parsed = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
        return Array.isArray(parsed) ? parsed.map(cleanChat).filter(Boolean) : [];
      } catch { return []; }
    };
    const write = (list) => {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); return true; } catch { return false; }
    };
    return {
      note: "Chats are saved in this browser only.",
      async load() { return read(); },
      async save(chat) {
        const list = read().filter((c) => c.id !== chat.id);
        list.push(chat);
        if (!write(list)) throw new Error("local storage unavailable");
      },
      async remove(id) { write(read().filter((c) => c.id !== id)); },
    };
  }

  function dbStore(col) {
    return {
      note: "Chats are saved privately to your account.",
      async load() {
        const snap = await col.get();
        return snap.docs.map((d) => cleanChat({ id: d.id, ...d.data() })).filter(Boolean);
      },
      async save(chat) {
        await col.doc(chat.id).set({ title: chat.title, createdAt: chat.createdAt, messages: chat.messages });
      },
      async remove(id) { await col.doc(id).delete(); },
    };
  }

  const storeReady = (async () => {
    const [db, user] = await Promise.all([use("db"), use("user")]);
    let uid = null;
    try { uid = db && user ? await user.id() : null; } catch { uid = null; }
    return uid ? dbStore(db.collection("data/users/" + uid)) : localStore();
  })();

  // One write at a time, in order, so a chat's writes never overlap.
  let writeChain = Promise.resolve();
  function persist(task) {
    writeChain = writeChain.then(task).catch((err) => {
      console.warn("Could not save chats.", err);
      els.storeNote.textContent = "Couldn't save your latest change. It stays on screen until you reload.";
    });
    return writeChain;
  }
  const saveChat = (chat) => persist(async () => (await storeReady).save(cleanChat(chat)));
  const removeChat = (id) => persist(async () => (await storeReady).remove(id));

  // ---------- State ----------
  let chats = [];
  let loaded = false;
  let currentId = null;          // null = a new, not-yet-saved chat
  let streaming = null;          // { chatId, controller }
  let confirmingId = null;       // chat whose delete is awaiting confirmation
  let sample = null;
  let sampleBlocked = false;

  const currentChat = () => chats.find((c) => c.id === currentId) || null;
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
  const makeTitle = (text) => {
    const t = text.replace(/\s+/g, " ").trim();
    return t.length > 40 ? t.slice(0, 40).trimEnd() + "…" : t || "Untitled chat";
  };

  // ---------- Rendering ----------
  function renderSidebar() {
    els.chatList.replaceChildren();
    const sorted = [...chats].sort((a, b) => b.createdAt - a.createdAt);
    if (!sorted.length) {
      const li = document.createElement("li");
      li.className = "empty-list";
      li.textContent = loaded ? "No saved chats yet" : "Loading chats…";
      els.chatList.append(li);
    }
    for (const chat of sorted) {
      const li = document.createElement("li");
      li.className = "chat-item" + (chat.id === currentId ? " active" : "");

      if (chat.id === confirmingId) {
        li.classList.add("confirming");
        const label = document.createElement("span");
        label.className = "confirm-label";
        label.textContent = "Delete this chat?";
        const yes = document.createElement("button");
        yes.className = "confirm-btn yes";
        yes.textContent = "Delete";
        yes.addEventListener("click", () => deleteChat(chat.id));
        const no = document.createElement("button");
        no.className = "confirm-btn";
        no.textContent = "Cancel";
        no.addEventListener("click", () => { confirmingId = null; renderSidebar(); });
        li.append(label, no, yes);
        els.chatList.append(li);
        continue;
      }

      const open = document.createElement("button");
      open.className = "open";
      open.textContent = chat.title;
      open.title = chat.title;
      open.addEventListener("click", () => selectChat(chat.id));

      const del = document.createElement("button");
      del.className = "delete";
      del.innerHTML = TRASH_SVG;
      del.setAttribute("aria-label", "Delete chat: " + chat.title);
      del.title = "Delete chat";
      del.addEventListener("click", () => { confirmingId = chat.id; renderSidebar(); });

      li.append(open, del);
      els.chatList.append(li);
    }
  }

  function messageEl(role, text) {
    const row = document.createElement("div");
    row.className = "msg " + role;
    if (role !== "user") {
      const av = document.createElement("span");
      av.className = "avatar";
      av.innerHTML = LOGO_SVG;
      row.append(av);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.append(bubble);
    return { row, bubble };
  }

  function renderThread() {
    const chat = currentChat();
    els.threadInner.replaceChildren();
    const hasMessages = chat && chat.messages.length > 0;
    els.thread.hidden = !hasMessages;
    els.emptyState.hidden = !!hasMessages;
    els.topTitle.textContent = chat ? chat.title : "Brian";
    if (!hasMessages) return;
    for (const m of chat.messages) els.threadInner.append(messageEl(m.role, m.content).row);
    scrollToBottom(true);
  }

  function showThread() {
    els.thread.hidden = false;
    els.emptyState.hidden = true;
  }

  function isNearBottom() {
    const t = els.thread;
    return t.scrollHeight - t.scrollTop - t.clientHeight < 80;
  }

  function scrollToBottom(force) {
    if (force || isNearBottom()) els.thread.scrollTop = els.thread.scrollHeight;
  }

  function updateComposer() {
    const busy = !!streaming;
    els.sendBtn.hidden = busy;
    els.stopBtn.hidden = !busy;
    els.input.disabled = sampleBlocked;
    els.sendBtn.disabled = busy || sampleBlocked || !els.input.value.trim();
  }

  function showNotice(text) {
    els.notice.textContent = text;
    els.notice.hidden = !text;
  }

  function autosize() {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 200) + "px";
  }

  // ---------- Actions ----------
  function selectChat(id) {
    if (streaming) streaming.controller.abort();
    currentId = id;
    confirmingId = null;
    renderSidebar();
    renderThread();
    closeSidebar();
    if (!sampleBlocked) els.input.focus();
  }

  function deleteChat(id) {
    if (streaming && streaming.chatId === id) streaming.controller.abort();
    chats = chats.filter((c) => c.id !== id);
    confirmingId = null;
    if (currentId === id) currentId = null;
    removeChat(id);
    renderSidebar();
    renderThread();
  }

  // The leading instructions turn, then the conversation; oldest turns go first when it grows too long.
  function buildInput(messages) {
    const turns = messages.map((m) => ({ role: m.role, content: m.content }));
    let size = RULES.length + turns.reduce((n, t) => n + t.content.length, 0);
    while (turns.length > 1 && size > MAX_INPUT_CHARS) size -= turns.shift().content.length;
    while (turns.length && turns[0].role !== "user") turns.shift();
    return [{ role: "user", content: RULES }, ...turns];
  }

  function errorCopy(code) {
    switch (code) {
      case "not_granted": return "Brian isn't allowed to use Claude in this view. Reload the page to be asked again.";
      case "sampling_disabled": return "Claude isn't available for your account here.";
      case "not_declared":
      case "capability_disabled":
      case "capability_removed": return "Claude isn't available in this view of the page.";
      case "rate_limited": return "You've reached a usage or rate limit. Wait a little, then send again.";
      case "session_expired": return "Your Claude session expired. Sign in again and reload the page.";
      case "refused": return "Brian can't help with that request.";
      case "prompt_too_large": return "This chat has grown too long. Start a new chat to continue.";
      case "empty_completion": return "Brian didn't write a reply. Try rephrasing your message.";
      default: return "Brian couldn't reach Claude just now. Send your message again to retry.";
    }
  }

  async function send() {
    const text = els.input.value.trim();
    if (!text || streaming || sampleBlocked) return;
    if (!sample) {
      showNotice("Brian can only answer inside Claude. Open this page on claude.ai or in the Claude app.");
      return;
    }

    let chat = currentChat();
    if (!chat) {
      chat = { id: newId(), title: makeTitle(text), createdAt: Date.now(), messages: [] };
      chats.push(chat);
      currentId = chat.id;
    }
    chat.messages.push({ role: "user", content: text });
    saveChat(chat);
    renderSidebar();

    els.input.value = "";
    autosize();
    showThread();
    els.topTitle.textContent = chat.title;
    els.threadInner.append(messageEl("user", text).row);

    const { row, bubble } = messageEl("assistant", "");
    const textNode = document.createElement("span");
    textNode.className = "thinking";
    textNode.textContent = "Thinking…";
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    bubble.append(textNode, cursor);
    els.threadInner.append(row);
    scrollToBottom(true);

    const controller = new AbortController();
    streaming = { chatId: chat.id, controller };
    updateComposer();

    let reply = "";
    let errorMessage = null;
    let note = null;
    try {
      const result = await sample(buildInput(chat.messages), {
        model: MODEL,
        modelTier: "default",
        cache: false,
        signal: controller.signal,
        onText: ({ text: whole }) => {
          reply = whole;
          textNode.className = "";
          textNode.textContent = whole;
          scrollToBottom(false);
        },
      });
      reply = result.text;
      if (result.truncated) note = "Brian's reply was cut short. Ask for less at a time.";
    } catch (e) {
      const code = e && e.code;
      reply = code === "refused" ? "" : (e && typeof e.text === "string" ? e.text : reply);
      if (code !== "cancelled") errorMessage = errorCopy(code);
      if (PERMANENT_ERRORS.has(code)) {
        sampleBlocked = true;
        showNotice(errorMessage);
      }
    } finally {
      cursor.remove();
      streaming = null;
      updateComposer();
    }

    // Keep whatever text arrived (including after Stop); show errors as a separate, unsaved note.
    const target = chats.find((c) => c.id === chat.id);
    if (reply.trim() && target) {
      textNode.textContent = reply;
      textNode.className = "";
      target.messages.push({ role: "assistant", content: reply });
      saveChat(target);
    } else {
      row.remove();
    }
    const shown = errorMessage || note;
    if (shown && currentId === chat.id) {
      els.threadInner.append(messageEl("error", shown).row);
      scrollToBottom(true);
    }
  }

  function openSidebar() { document.body.classList.add("sidebar-open"); }
  function closeSidebar() { document.body.classList.remove("sidebar-open"); }

  // ---------- Events ----------
  els.composer.addEventListener("submit", (e) => { e.preventDefault(); send(); });
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  els.input.addEventListener("input", () => { autosize(); updateComposer(); });
  els.stopBtn.addEventListener("click", () => { if (streaming) streaming.controller.abort(); });
  els.newChat.addEventListener("click", () => selectChat(null));
  els.menuBtn.addEventListener("click", openSidebar);
  els.scrim.addEventListener("click", closeSidebar);

  renderSidebar();
  renderThread();
  updateComposer();
  els.input.focus();

  use("sample").then((s) => {
    sample = s;
    if (!s) showNotice("Brian can only answer inside Claude. Open this page on claude.ai or in the Claude app.");
  });

  storeReady
    .then(async (store) => {
      els.storeNote.textContent = store.note;
      const saved = await store.load();
      const unsaved = chats.filter((c) => !saved.some((s) => s.id === c.id));
      chats = saved.concat(unsaved);
    })
    .catch((err) => {
      console.warn("Could not load saved chats.", err);
      els.storeNote.textContent = "Couldn't load your saved chats. New chats still work.";
    })
    .finally(() => {
      loaded = true;
      renderSidebar();
      if (currentId && !streaming) renderThread();
    });
})();
</script>

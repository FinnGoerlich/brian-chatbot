# Render Blueprint for Brian. Secrets are entered in the Render dashboard, never in this file.
services:
  - type: web
    name: brian-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BRIAN_LOGIN_EMAIL
        sync: false
      - key: BRIAN_LOGIN_PASSWORD
        sync: false
      - key: BRIAN_SESSION_SECRET
        generateValue: true

        INTERVIEWS_MERGED: merged.size,
        CURRENT_CONTEXT: current.context || "(empty: this is the first interview merged into the case context)",
        OPEN_QUESTIONS: current.questions || "(no open questions file)",
        TRANSCRIPT: transcriptBody(chat),
      });
      if (prompt.length > MAX_INPUT_CHARS) throw { code: "prompt_too_large" };
      const result = await sample(prompt, { model: MODEL, modelTier: "default", cache: false });
      const context = result.text.replace(/^```(?:markdown|md)?\s*\n/, "").replace(/\n```\s*$/, "").trim();

      status.bubble.textContent = "Updating the case card…";
      let card = current.card && typeof current.card === "object" ? current.card : null;
      try {
        const extracted = await sample.json(fill(prompts.card, {
          CASE_CODE: caseCode, CASE_NAME: current.caseName || caseCode,
          CURRENT_CARD: JSON.stringify(current.card || {}), CONTEXT: context,
        }), { modelTier: "quick", cache: false });
        if (extracted && typeof extracted === "object" && !Array.isArray(extracted)) {
          card = { ...normCard(extracted, current.questions), updatedAt: Date.now() };
        }
      } catch (e) {
        console.warn("The case card was not updated.", e);
      }

      const now = Date.now();
      const update = { context, contextUpdatedAt: now, mergedChats: [...merged] };
      if (card) update.card = card;
      await persist(() => db.doc("cases/" + caseCode).update(update));
      await persist(() => chatRef(chat.id).update({ contextMerged: true, contextMergedAt: now }));
      caseDoc = { ...caseDoc, ...update };
      chat.contextMerged = true;
      if (libraryLoaded) {
        const entry = caseFromDoc(caseCode, { ...current, ...update });
        library = library.filter((c) => c.code !== caseCode).concat(entry);
      }
      outcome = "The case context and case card now include this interview, so it shows up in Brian Ask. Claude Code copies it to the case SharePoint at the next sync.";
    } catch (e) {
      outcome = (e && e.code ? handleSampleError(e) : null) || "Brian couldn't update the case context. Try again in a moment.";
    } finally {
      merging = false;
    }
    status.row.remove();
    if (currentId === chat.id && view === "chat") {
      els.threadInner.append(messageEl(chat.contextMerged ? "status" : "error", outcome).row);
      scrollToBottom(true);
    }
    updateComposer();
    renderSidebar();
  }

  // ---------- Transcript download ----------
  function transcriptText(chat) {
    return [
      "BRIAN CASE CONTEXT INTERVIEW - TRANSCRIPT",
      "Case code: " + caseCode,
      "Case: " + (caseDoc?.caseName || caseCode),
      "Interview: " + shortId(chat.id),
      "Interview started: " + stamp(chat.createdAt),
      "Interview mode: " + (chat.mode === "batch" ? "all questions at once" : "step by step"),
      "Transcript saved: " + stamp(Date.now()),
      "Messages: " + chat.messages.length,
      "",
      "Speakers: \"Brian\" is the AI interviewer; \"Interviewee\" is the case team member.",
      "The interview closes with a \"# Project knowledge record\"; settled open questions have a \"Recorded for Qnn:\" line.",
      "",
      "=".repeat(60),
      "",
      transcriptBody(chat),
    ].join("\n");
  }

  async function saveTranscript() {
    const chat = currentChat();
    if (!downloads || !chat || !chat.messages.length) return;
    const filename = `${day(chat.createdAt)}_${caseCode}_${shortId(chat.id)}.txt`;
    try {
      await downloads.save({ filename, data: transcriptText(chat) });
    } catch (e) {
      if (e && e.code === "declined") return;
      setBanner(e && e.code === "rate_limited" ? "A save is already waiting for your confirmation." : "The transcript couldn't be saved in this view.");
    }
  }

  // ---------- Attachments ----------
  async function addFiles(fileList) {
    if (!assets) return;
    for (const file of [...fileList]) {
      const ext = (file.name.split(".").pop() || "").toLowerCase();
      if (OFFICE.test(file.name)) { setBanner(`${file.name}: Word, Excel, PowerPoint and Outlook files can't be uploaded here. Save it as PDF, or put it straight into the case SharePoint.`); continue; }
      const type = FILE_TYPES[ext];
      if (!type) { setBanner(`${file.name}: this file type can't be uploaded. Use PDF, an image, or a .txt, .md, .csv or .json file.`); continue; }
      const item = { name: file.name, contentType: type, sizeBytes: file.size, assetId: "", inline: "", blob: null };
      pending.push(item);
      updateComposer();
      try {
        const res = await assets.upload(file, { type });
        item.assetId = res.id;
        item.sizeBytes = res.sizeBytes;
        if (type.startsWith("text/") || type === "application/json") {
          const text = await file.text();
          if (text.length <= MAX_INLINE_TEXT) item.inline = text;
        }
        if (type.startsWith("image/") && sampleLimits?.images) item.blob = file;
      } catch (e) {
        pending = pending.filter((p) => p !== item);
        const code = e && e.code;
        setBanner(code === "too_large" ? `${file.name} is larger than 20 MB.`
          : code === "unsupported_type" ? `${file.name}: this file type can't be uploaded.`
          : code === "quota_or_state" ? "The artifact's file storage is full."
          : `${file.name} couldn't be uploaded. Try again.`);
      }
      updateComposer();
    }
  }

  function removePending(item) {
    pending = pending.filter((p) => p !== item);
    if (assets && item.assetId) assets.delete(item.assetId).catch(() => {});
    updateComposer();
  }

  function openSidebar() { document.body.classList.add("sidebar-open"); }
  function closeSidebar() { document.body.classList.remove("sidebar-open"); }

  // ---------- Events ----------
  els.modeAsk.addEventListener("click", () => setMode("ask"));
  els.modeInterview.addEventListener("click", () => setMode("interview"));
  els.newAsk.addEventListener("click", () => {
    if (streaming) return;
    askTurns = [];
    focusCode = "";
    view = "library";
    renderMain();
    closeSidebar();
    els.input.focus();
  });
  els.caseForm.addEventListener("submit", (e) => { e.preventDefault(); openCase(els.caseInput.value); });
  els.composer.addEventListener("submit", (e) => {
    e.preventDefault();
    if (mode === "ask") askSend(els.input.value, view === "card" ? focusCode : "");
    else send();
  });
  els.input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
    if (isBatch() && !(e.ctrlKey || e.metaKey)) return;   // a new line, so dictation can't send half an answer
    e.preventDefault();
    els.composer.requestSubmit();
  });
  els.input.addEventListener("input", () => { autosize(); updateComposer(); });
  els.stopBtn.addEventListener("click", () => { if (streaming) streaming.controller.abort(); });
  els.newChat.addEventListener("click", () => selectChat(null));
  els.startBtn.addEventListener("click", () => { startMode = "step"; els.input.value = START_MESSAGE; send(); });
  els.startBatchBtn.addEventListener("click", () => { startMode = "batch"; els.input.value = START_BATCH_MESSAGE; send(); });
  els.saveBtn.addEventListener("click", saveTranscript);
  els.finishBtn.addEventListener("click", finishChat);
  els.contextBtn.addEventListener("click", () => {
    if (streaming) streaming.controller.abort();
    view = "context"; currentId = null; renderMain(); closeSidebar();
  });
  els.changeCaseBtn.addEventListener("click", changeCase);
  els.attachBtn.addEventListener("click", () => els.fileInput.click());
  els.fileInput.addEventListener("change", () => { addFiles(els.fileInput.files); els.fileInput.value = ""; });
  els.menuBtn.addEventListener("click", openSidebar);
  els.scrim.addEventListener("click", closeSidebar);
  for (const s of SUGGESTIONS) els.suggestions.append(button("suggestion", s, () => askSend(s)));

  // ---------- Start ----------
  els.caseInput.value = storageGet(LAST_CASE_KEY);
  renderMain();
  if (view === "picker") els.caseInput.focus();

  const dbReady = Promise.all([use("db"), use("user")]).then(async ([d, u]) => {
    db = d;
    try { uid = u ? await u.id() : null; } catch { uid = null; }
    els.storeNote.textContent = d ? "Cases and interviews are shared with everyone who can open this page." : "";
  });

  const fetchText = (path) => fetch(path).then((r) => (r.ok ? r.text() : Promise.reject(new Error(path + " " + r.status))));
  Promise.all(["interview_prompt.txt", "context_prompt.txt", "card_prompt.txt", "ask_prompt.txt"].map(fetchText))
    .then(([interview, context, card, ask]) => { prompts = { interview, context, card, ask }; updateComposer(); })
    .catch((err) => { console.warn("Could not load prompts.", err); setBanner("Brian couldn't load its instructions. Reload the page to try again."); });

  use("sample").then(async (s) => {
    sample = s;
    if (!s) return setBanner("Brian can only answer inside Claude. Open this page on claude.ai or in the Claude app.");
    sampleLimits = await s.limits().catch(() => null);
  });
  use("downloads").then((d) => { downloads = d; updateComposer(); });
  use("assets").then((a) => { assets = a; updateComposer(); });
  use("mcp").then((m) => { mcp = m; });
  loadLibrary();
})();
</script>

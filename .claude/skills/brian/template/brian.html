<title>Brian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: 260px sidebar (mode toggle + case or interview list), main pane on the right: a card library,
     a card detail, or a chat thread, with the composer at the bottom. Sidebar becomes a drawer under 760px.
     Single deliberate dark theme, per the Brian spec. Area colours mark practice areas on case cards. */
  :root {
    --bg: #0B1A13;
    --surface: #11261C;
    --surface-2: #173527;
    --accent: #2E8B57;
    --accent-light: #7CE3A6;
    --text: #E6F2EA;
    --text-muted: #8FB3A0;
    --border: rgba(124, 227, 166, 0.12);
    --border-strong: rgba(124, 227, 166, 0.28);
    --danger: #E58C8C;
    --danger-bg: rgba(229, 140, 140, 0.08);
    --danger-border: rgba(229, 140, 140, 0.35);
    --scrim: rgba(0, 0, 0, 0.5);
    --area-1: #7CE3A6;
    --area-2: #6CC6E0;
    --area-3: #E3C26B;
    --area-4: #C3A8F0;
    --area-5: #F0A88B;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
    --sidebar-w: 260px;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--font);
    display: flex;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-block: 16px;
    padding-left: var(--gutter-l);
    padding-right: 12px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 6px 0;
    font-size: 20px; font-weight: 650; color: var(--accent-light);
  }
  .brand svg { width: 32px; height: 32px; }
  .mode-toggle {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    padding: 4px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 12px;
  }
  .mode-toggle button {
    border: none; background: transparent; border-radius: 8px;
    padding: 7px 8px; font-size: 13px; font-weight: 600; color: var(--text-muted);
  }
  .mode-toggle button[aria-selected="true"] { background: var(--surface-2); color: var(--accent-light); }
  .side-section { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
  .case-block {
    display: flex; flex-direction: column; gap: 2px;
    padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg);
  }
  .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .case-code { font-family: var(--mono); font-size: 14px; color: var(--accent-light); overflow-wrap: anywhere; }
  .case-name { font-size: 13px; overflow-wrap: anywhere; }
  .case-actions { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
  .new-chat {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: 600;
    text-align: left;
  }
  .new-chat:hover:not(:disabled) { filter: brightness(1.1); }
  .new-chat:disabled { opacity: 0.45; }
  .list-label { padding: 0 6px; }
  .chat-list {
    list-style: none; margin: 0; padding: 0;
    overflow-y: auto; flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .chat-item {
    display: flex; align-items: center; gap: 4px;
    border-radius: 10px;
    border: 1px solid transparent;
    min-height: 40px;
  }
  .chat-item:hover { background: rgba(124, 227, 166, 0.06); }
  .chat-item.active { background: var(--surface-2); border-color: var(--border); }
  .chat-item .open {
    flex: 1; min-width: 0;
    background: none; border: none;
    padding: 7px 10px;
    text-align: left;
    color: var(--text);
    display: flex; flex-direction: column;
  }
  .chat-item .open .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
  .chat-item .open .s { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--area); flex-shrink: 0; }
  .chat-item .delete {
    background: none; border: none;
    padding: 6px 8px; margin-right: 4px;
    color: var(--text-muted);
    border-radius: 8px;
    opacity: 0;
    display: flex;
  }
  .chat-item:hover .delete, .chat-item.active .delete, .chat-item .delete:focus-visible { opacity: 1; }
  .chat-item .delete:hover { color: var(--danger); }
  .chat-item .delete svg { width: 16px; height: 16px; }
  .chat-item.confirming { background: var(--danger-bg); border-color: var(--danger-border); }
  .confirm-label { flex: 1; min-width: 0; padding: 0 10px; font-size: 13px; }
  .confirm-btn {
    border: none; border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: 600;
    background: transparent; color: var(--text-muted);
  }
  .confirm-btn.yes { background: var(--danger); color: var(--bg); margin-right: 2px; }
  .empty-list { color: var(--text-muted); font-size: 13px; padding: 6px 10px; }
  .store-note { color: var(--text-muted); font-size: 12px; padding: 0 6px; }

  /* Main panel */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: none;
    align-items: center; gap: 10px;
    padding-block: 10px;
    padding-left: var(--gutter-l);
    padding-right: var(--gutter-r);
    border-bottom: 1px solid var(--border);
  }
  .menu-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 8px; display: flex;
  }
  .menu-btn svg { width: 20px; height: 20px; }
  .topbar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .banner {
    margin: 12px var(--gutter-r) 0 16px;
    padding: 8px 12px; border-radius: 10px; font-size: 13px;
    background: var(--danger-bg); border: 1px solid var(--danger-border);
  }
  .link-btn {
    background: none; border: none; padding: 0;
    color: var(--accent-light); font-size: 12px; text-decoration: underline; text-underline-offset: 2px;
  }
  .back { align-self: flex-start; font-size: 13px; }
  .btn {
    border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border-strong); background: transparent; color: var(--text);
  }
  .btn:hover:not(:disabled) { border-color: var(--accent-light); color: var(--accent-light); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--text); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); color: var(--text); }
  .btn:disabled { opacity: 0.45; }

  /* Library and card detail */
  .pane {
    flex: 1; overflow-y: auto;
    padding-block: 28px 16px;
    padding-left: 16px;
    padding-right: var(--gutter-r);
  }
  .pane-inner { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .lib-head { display: flex; flex-direction: column; gap: 6px; }
  .lib-head h1 { margin: 0; font-size: 28px; font-weight: 650; line-height: 1.2; text-wrap: balance; }
  .lib-head p { margin: 0; color: var(--text-muted); max-width: 64ch; }
  .eyebrow { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-light); font-weight: 600; }
  .area-filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    padding: 5px 12px; font-size: 13px; color: var(--text-muted);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .filter[aria-pressed="true"] { border-color: var(--area, var(--accent-light)); color: var(--text); background: var(--surface-2); }
  .filter .n { font-variant-numeric: tabular-nums; opacity: 0.8; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .case-card {
    display: flex; flex-direction: column; gap: 10px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    min-width: 0;
  }
  .case-card:hover { border-color: var(--border-strong); }
  .cc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  .area-chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    color: var(--area);
    background: color-mix(in srgb, var(--area) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--area) 32%, transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cc-period { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cc-title {
    background: none; border: none; padding: 0; text-align: left;
    font-size: 17px; font-weight: 650; line-height: 1.3; color: var(--text); text-wrap: balance;
  }
  .cc-title:hover { color: var(--accent-light); }
  .cc-meta { margin: -4px 0 0; font-size: 13px; color: var(--text-muted); }
  .cc-summary {
    margin: 0; font-size: 14px;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cc-results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .cc-results li { position: relative; padding-left: 14px; }
  .cc-results li::before {
    content: ""; position: absolute; left: 0; top: 0.55em;
    width: 6px; height: 6px; border-radius: 50%; background: var(--area);
  }
  .cc-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
  .meter { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--area); border-radius: inherit; }
  .cc-complete { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; }
  .cc-code { font-family: var(--mono); }
  .cc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .lib-empty {
    padding: 28px; border: 1px dashed var(--border-strong); border-radius: 14px;
    color: var(--text-muted); text-align: center;
  }
  .detail-head { display: flex; flex-direction: column; gap: 8px; }
  .detail-head .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .detail-head h1 { margin: 0; font-size: 26px; font-weight: 650; line-height: 1.25; text-wrap: balance; }
  .detail-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--text-muted); }
  .detail-meta b { color: var(--text); font-weight: 600; }
  .detail-summary { margin: 0; max-width: 72ch; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .detail-block {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; min-width: 0;
  }
  .detail-block h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .detail-block ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .detail-block p { margin: 0; font-size: 14px; color: var(--text-muted); }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic {
    border: 1px solid var(--border-strong); background: var(--bg); border-radius: 999px;
    padding: 4px 10px; font-size: 13px; text-align: left;
  }
  .topic:hover { border-color: var(--accent-light); color: var(--accent-light); }
  .completeness { display: flex; flex-direction: column; gap: 8px; }
  .completeness .meter { height: 8px; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Thread */
  .thread {
    flex: 1; overflow-y: auto;
    padding-block: 24px;
    padding-left: 16px;
    padding-right: var(--gutter-r);
  }
  .thread-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  .msg.user { justify-content: flex-end; }
  .avatar { width: 30px; height: 30px; flex-shrink: 0; margin-top: 2px; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    max-width: min(640px, 88%);
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--accent); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error .bubble { background: var(--danger-bg); border: 1px solid var(--danger-border); }
  .msg.status .bubble { background: transparent; border: 1px dashed var(--border); color: var(--text-muted); }
  .bubble .files, .bubble .looked { display: block; margin-top: 8px; font-size: 12px; color: var(--text-muted); }
  .msg.user .bubble .files { color: var(--text); opacity: 0.85; }
  .thinking { color: var(--text-muted); }
  .cursor {
    display: inline-block;
    width: 8px; height: 1.05em;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: var(--accent-light);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  .context-doc {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px;
  }
  .context-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
  .context-head h2 { margin: 0; font-size: 18px; }
  .context-head span { color: var(--text-muted); font-size: 13px; }

  /* Interview start screens */
  .empty-state {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 8px;
    padding-block: 24px;
    padding-left: var(--gutter-l);
    padding-right: var(--gutter-r);
  }
  .empty-state svg { width: 72px; height: 72px; margin-bottom: 8px; }
  .empty-state h1 { margin: 0; font-size: 26px; font-weight: 650; text-wrap: balance; }
  .empty-state p { margin: 0; color: var(--text-muted); max-width: 50ch; }
  .case-form { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; width: 100%; max-width: 420px; }
  .case-form input {
    flex: 1 1 200px; min-width: 0;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font: 15px var(--mono); padding: 10px 12px; text-transform: uppercase;
  }
  .case-form input::placeholder { text-transform: none; font-family: var(--font); color: var(--text-muted); }
  .case-form input:focus { outline: none; border-color: var(--accent-light); }
  .form-error { color: var(--danger) !important; font-size: 14px; }
  .start-btn {
    background: var(--accent); border: none; border-radius: 10px;
    padding: 10px 18px; font-weight: 600;
  }
  .start-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .start-btn:disabled { opacity: 0.45; }
  .start-options {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;
    width: 100%; max-width: 560px; margin-top: 14px; text-align: left;
  }
  .start-option {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px;
    padding: 14px 16px; text-align: left;
  }
  .start-option:hover:not(:disabled) { border-color: var(--accent-light); }
  .start-option:disabled { opacity: 0.45; }
  .start-option b { font-size: 15px; color: var(--accent-light); }
  .start-option span { font-size: 13px; color: var(--text-muted); }

  /* Composer */
  .composer {
    padding-block: 12px 18px;
    padding-left: 16px;
    padding-right: var(--gutter-r);
    border-top: 1px solid transparent;
  }
  .suggestions { max-width: 760px; margin: 0 auto 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .suggestion {
    border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; text-align: left;
  }
  .suggestion:hover { border-color: var(--accent-light); color: var(--accent-light); }
  .chips { max-width: 760px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 6px 4px 12px; font-size: 13px;
  }
  .chip .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .chip .x { background: none; border: none; color: var(--text-muted); padding: 0 6px; font-size: 15px; line-height: 1; }
  .chip.busy { color: var(--text-muted); }
  .composer-inner {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
  }
  .composer-inner:focus-within { border-color: var(--accent-light); }
  .attach-btn { background: none; border: none; color: var(--text-muted); padding: 6px; border-radius: 8px; display: flex; }
  .attach-btn:hover:not(:disabled) { color: var(--accent-light); }
  .attach-btn svg { width: 20px; height: 20px; }
  textarea {
    flex: 1; min-width: 0;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text);
    font: inherit;
    padding: 6px 8px;
    max-height: 200px;
    outline: none;
  }
  textarea.batch { max-height: 50vh; }
  textarea::placeholder { color: var(--text-muted); }
  .send, .stop { border: none; border-radius: 10px; padding: 8px 14px; font-weight: 600; }
  .send { background: var(--accent); }
  .send:disabled { opacity: 0.45; }
  .stop { background: transparent; border: 1px solid var(--accent-light); color: var(--accent-light); }
  .actions-row {
    max-width: 760px; margin: 8px auto 0;
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--text-muted);
  }
  .actions-row .btns { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .finish-btn {
    background: transparent; border: 1px solid var(--accent-light); color: var(--accent-light);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600;
  }
  .finish-btn.ready { background: var(--accent-light); color: var(--bg); }
  .finish-btn:disabled { opacity: 0.45; }

  .scrim { display: none; }

  @media (max-width: 760px) {
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 20;
      padding-top: max(16px, env(safe-area-inset-top, 0px));
      padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    body.sidebar-open .sidebar { transform: none; }
    body.sidebar-open .scrim { display: block; position: fixed; inset: 0; z-index: 10; background: var(--scrim); }
    .topbar { display: flex; }
    .pane, .thread { padding-left: var(--gutter-l); }
    .pane { padding-block: 18px 12px; }
    .thread { padding-block: 16px; }
    .composer { padding-block: 8px 12px; padding-left: var(--gutter-l); }
    .banner { margin-left: var(--gutter-l); }
    .lib-head h1 { font-size: 23px; }
    .chat-item .delete { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
</style>

<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="logo-slot"></span>Brian</div>
  <div class="mode-toggle" role="tablist" aria-label="Mode">
    <button type="button" role="tab" id="modeAsk" aria-selected="true">Ask</button>
    <button type="button" role="tab" id="modeInterview" aria-selected="false">Get asked</button>
  </div>

  <div class="side-section" id="askSide">
    <button class="new-chat" id="newAsk">+ New question</button>
    <span class="label list-label">Cases on file</span>
    <ul class="chat-list" id="caseList"></ul>
  </div>

  <div class="side-section" id="interviewSide" hidden>
    <div class="case-block" id="caseBlock" hidden>
      <span class="label">Case</span>
      <span class="case-code" id="caseCodeLabel"></span>
      <span class="case-name" id="caseNameLabel"></span>
      <div class="case-actions">
        <button type="button" class="link-btn" id="contextBtn">View case context</button>
        <button type="button" class="link-btn" id="changeCaseBtn">Change case</button>
      </div>
    </div>
    <button class="new-chat" id="newChat" disabled>+ New interview</button>
    <span class="label list-label" id="listLabel" hidden>Interviews</span>
    <ul class="chat-list" id="chatList"></ul>
  </div>
  <div class="store-note" id="storeNote"></div>
</aside>
<div class="scrim" id="scrim"></div>

<main class="main">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open the sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="title" id="topTitle">Brian</span>
  </div>
  <div class="banner" id="banner" role="status" hidden></div>

  <section class="pane" id="libraryView" hidden>
    <div class="pane-inner">
      <header class="lib-head">
        <span class="eyebrow">Brian Ask</span>
        <h1>What can past cases tell you?</h1>
        <p id="libIntro">Loading the cases on file…</p>
      </header>
      <div class="area-filters" id="areaFilters" role="group" aria-label="Filter by practice area"></div>
      <div class="card-grid" id="cardGrid"></div>
    </div>
  </section>

  <section class="pane" id="cardView" hidden>
    <div class="pane-inner" id="cardDetail"></div>
  </section>

  <div class="empty-state" id="pickerView" hidden>
    <span class="logo-slot"></span>
    <h1>Get asked about your case</h1>
    <p>A short debrief that turns what you know into a reusable record for future case teams. Enter the case code to start.</p>
    <form class="case-form" id="caseForm">
      <input id="caseInput" placeholder="Case code, e.g. DEMO-LIGHTHOUSE" autocomplete="off" spellcheck="false" aria-label="Case code">
      <button type="submit" class="start-btn" id="openCaseBtn">Open case</button>
    </form>
    <p class="form-error" id="caseError" role="alert" hidden></p>
  </div>

  <div class="empty-state" id="caseView" hidden>
    <span class="logo-slot"></span>
    <h1 id="caseTitle"></h1>
    <p id="caseSummary"></p>
    <div class="start-options" role="group" aria-label="How do you want to be interviewed?">
      <button type="button" class="start-option" id="startBtn">
        <b>Step by step</b>
        <span>Brian asks how much time you have, then one question at a time, and follows up as you go.</span>
      </button>
      <button type="button" class="start-option" id="startBatchBtn">
        <b>All questions at once</b>
        <span>Get the full list, answer it in one go (dictating works well), and get any follow-ups as one list too.</span>
      </button>
    </div>
  </div>

  <div class="thread" id="thread" hidden>
    <div class="thread-inner" id="threadInner"></div>
  </div>

  <form class="composer" id="composer" hidden>
    <div class="suggestions" id="suggestions" hidden></div>
    <div class="chips" id="chips" hidden></div>
    <div class="composer-inner">
      <button type="button" class="attach-btn" id="attachBtn" aria-label="Attach files" title="Attach files (PDF, images, .txt, .md, .csv, .json)" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 0 1-2.6-2.6l8.5-8.5"/></svg>
      </button>
      <input type="file" id="fileInput" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.md,.csv,.json">
      <textarea id="input" rows="1" placeholder="Message Brian…" aria-label="Message"></textarea>
      <button type="submit" class="send" id="sendBtn" disabled>Send</button>
      <button type="button" class="stop" id="stopBtn" hidden>Stop</button>
    </div>
    <div class="actions-row">
      <span id="composerNote"></span>
      <span class="btns">
        <button type="button" class="link-btn" id="saveBtn" hidden>Save transcript (.txt)</button>
        <button type="button" class="finish-btn" id="finishBtn" hidden>Finish &amp; update case context</button>
      </span>
    </div>
  </form>
</main>

<script>
(() => {
  "use strict";

  // Brian as a Claude Artifact, with two modes. No backend, no API key.
  // - Ask: questions across every case on file. Case cards come from cases/<CODE>.card; Claude reads a
  //   case's context and file digests through page tools (cases/<CODE>/docs, cases/<CODE>/files).
  // - Get asked: a time-first debrief interview (the team's procurement-project-debrief skill, adapted),
  //   stored under cases/<CODE>/chats and merged into the case's living context and card.
  // The /brian skill in Claude Code loads questions, cards and file digests, and mirrors results to SharePoint.
  const MODEL = "claude-sonnet-5-5";
  const START_MESSAGE = "Hi Brian, let's start.";
  const START_BATCH_MESSAGE = "Hi Brian, please give me all the questions at once. I'll answer them in one go.";
  const MODE_TEXT = {
    step: "step by step (one question at a time).",
    batch: "all at once (batch mode: the full list of questions in one message, follow-ups as one list).",
  };
  const LAST_CASE_KEY = "brian.lastCase";
  const MODE_KEY = "brian.mode";
  const MAX_INPUT_CHARS = 200000;    // the platform caps input at 256 KiB
  const MAX_INLINE_TEXT = 30000;     // text files up to this size are given to Claude in full
  const TOOL_CHUNK = 20000;          // tool results are capped at 32 KB
  const M365 = "Microsoft 365";      // connector display name, as declared in the manifest
  const AREA_COLOURS = 5;
  const PERMANENT_ERRORS = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);
  const FILE_TYPES = {
    pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp",
    txt: "text/plain", md: "text/markdown", csv: "text/csv", json: "application/json",
  };
  const OFFICE = /\.(docx?|xlsx?|xlsm|pptx?|msg)$/i;
  const SUGGESTIONS = [
    "Give me an overview of all cases on file",
    "I'm starting a procurement case for a logistics company. Which past cases should I look at?",
    "What have we learned about running a value-capture PMO?",
  ];

  const LOGO_SVG = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path fill="#7CE3A6" d="M31 10C24 8 17 11 15 17C10 18 7 23 8 28C5 31 5 37 8 40C7 46 11 51 17 52C20 56 26 57 31 54Z"/>
    <path fill="#2E8B57" d="M33 10C40 8 47 11 49 17C54 18 57 23 56 28C59 31 59 37 56 40C57 46 53 51 47 52C44 56 38 57 33 54Z"/>
    <g fill="none" stroke="#0B1A13" stroke-width="2.5" stroke-linecap="round">
      <path d="M24 17C20 19 20 24 23 26"/><path d="M14 30C18 30 21 33 21 37"/>
      <path d="M25 34C28 36 28 41 25 44"/><path d="M16 44C19 43 22 45 23 48"/>
      <path d="M40 17C44 19 44 24 41 26"/><path d="M50 30C46 30 43 33 43 37"/>
      <path d="M39 34C36 36 36 41 39 44"/><path d="M48 44C45 43 42 45 41 48"/>
    </g>
  </svg>`;
  const TRASH_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>`;

  const $ = (id) => document.getElementById(id);
  const els = {};
  for (const id of ["sidebar", "modeAsk", "modeInterview", "askSide", "newAsk", "caseList", "interviewSide", "caseBlock",
    "caseCodeLabel", "caseNameLabel", "contextBtn", "changeCaseBtn", "newChat", "listLabel", "chatList", "storeNote", "scrim",
    "menuBtn", "topTitle", "banner", "libraryView", "libIntro", "areaFilters", "cardGrid", "cardView", "cardDetail",
    "pickerView", "caseForm", "caseInput", "openCaseBtn", "caseError", "caseView", "caseTitle", "caseSummary", "startBtn", "startBatchBtn",
    "thread", "threadInner", "composer", "suggestions", "chips", "attachBtn", "fileInput", "input", "sendBtn", "stopBtn",
    "composerNote", "saveBtn", "finishBtn"]) els[id] = $(id);

  document.querySelectorAll(".logo-slot").forEach((n) => { n.innerHTML = LOGO_SVG; });

  const use = (name) => (window.claude && typeof window.claude.use === "function")
    ? window.claude.use(name).catch(() => null)
    : Promise.resolve(null);

  // ---------- Helpers ----------
  const pad = (n) => String(n).padStart(2, "0");
  const day = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const hhmm = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const stamp = (ms) => `${day(ms)} ${hhmm(ms)}`;
  const shortId = (id) => id.replace(/-/g, "").slice(0, 8);
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
  const fill = (tpl, vars) => tpl.replace(/\{\{(\w+)\}\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  const kb = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");
  const storageGet = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
  const storageSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* per-viewer convenience only */ } };
  const str = (v) => (typeof v === "string" ? v.trim() : "");
  const list = (v, n) => (Array.isArray(v) ? v.filter((x) => typeof x === "string" && x.trim()).map((x) => x.trim()).slice(0, n) : []);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const button = (cls, text, onClick) => {
    const b = el("button", cls, text);
    b.type = "button";
    b.addEventListener("click", onClick);
    return b;
  };

  function normaliseCode(raw) {
    const code = String(raw || "").trim().toUpperCase().replace(/\s+/g, "-");
    return /^[A-Z0-9_\-.~:@+]{1,60}$/.test(code) && code !== "." && code !== ".." ? code : "";
  }

  const countQuestions = (text) => (String(text || "").match(/^Q\d{2,}\s*$/gm) || []).length;

  function normCard(c, questions) {
    c = c && typeof c === "object" && !Array.isArray(c) ? c : {};
    const total = Number(c.completeness?.total) || countQuestions(questions);
    return {
      client: str(c.client), industry: str(c.industry), area: str(c.area) || "Other", geography: str(c.geography),
      period: str(c.period), caseType: str(c.caseType), summary: str(c.summary),
      keyResults: list(c.keyResults, 4), lessons: list(c.lessons, 4), documents: list(c.documents, 4),
      goodToAskAbout: list(c.goodToAskAbout, 8),
      completeness: { settled: Math.min(Number(c.completeness?.settled) || 0, total || 0), total },
    };
  }

  function caseFromDoc(id, d) {
    d = d || {};
    return {
      code: id,
      name: str(d.caseName) || id,
      card: normCard(d.card, d.questions),
      context: typeof d.context === "string" ? d.context : "",
      questions: typeof d.questions === "string" ? d.questions : "",
      contextUpdatedAt: Number(d.contextUpdatedAt) || 0,
      merged: Array.isArray(d.mergedChats) ? d.mergedChats.length : 0,
      sharepoint: d.sharepoint && str(d.sharepoint.driveId) && str(d.sharepoint.folderPath)
        ? { driveId: str(d.sharepoint.driveId), folderPath: str(d.sharepoint.folderPath).replace(/^\/+|\/+$/g, "") }
        : null,
    };
  }

  function cleanChat(id, c) {
    if (!c || !Array.isArray(c.messages)) return null;
    return {
      id,
      title: typeof c.title === "string" && c.title ? c.title : "Interview",
      createdAt: Number(c.createdAt) || 0,
      author: typeof c.author === "string" ? c.author : "",
      mode: c.mode === "batch" ? "batch" : "step",
      contextMerged: !!c.contextMerged,
      messages: c.messages
        .filter((m) => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string")
        .map((m) => ({
          role: m.role, content: m.content, at: Number(m.at) || 0,
          files: Array.isArray(m.files) ? m.files.filter((f) => f && f.name).map((f) => ({
            name: String(f.name), assetId: String(f.assetId || ""), contentType: String(f.contentType || ""),
            sizeBytes: Number(f.sizeBytes) || 0, inline: typeof f.inline === "string" ? f.inline : "",
          })) : [],
        })),
    };
  }

  // ---------- State ----------
  let db = null, uid = null, sample = null, sampleLimits = null, downloads = null, assets = null, mcp = null;
  let prompts = null;
  let mode = storageGet(MODE_KEY) === "interview" ? "interview" : "ask";
  let view = mode === "ask" ? "library" : "picker";   // library | card | ask | context | picker | case | chat
  let streaming = null;            // { kind: "ask" | "interview", controller, chatId? }
  let sampleBlocked = false;

  // Ask
  let library = [];
  let libraryLoaded = false;
  let libraryError = "";
  let areaFilter = "";
  let focusCode = "";
  let contextCode = "";
  let askTurns = [];               // { role, content, looked? }
  const fileCache = new Map();
  const spCache = new Map();       // SharePoint reads of this visit, by address and pages

  // Get asked
  let caseCode = "", caseDoc = null;
  let chats = [];
  const created = new Set();       // interview ids that already exist in the store
  let currentId = null;
  let merging = false;
  let confirmingId = null;
  let pending = [];                // attachments for the next message
  let startMode = "step";          // mode for the next new interview, set by the start buttons

  const currentChat = () => chats.find((c) => c.id === currentId) || null;
  const libraryCase = (code) => library.find((c) => c.code === code) || null;

  // ---------- Store writes (one at a time, in order) ----------
  let writeChain = Promise.resolve();
  function persist(task) {
    const run = writeChain.then(task);
    writeChain = run.catch((err) => {
      console.warn("Could not save.", err);
      els.storeNote.textContent = "Couldn't save your latest change. It stays on screen until you reload.";
    });
    return run;
  }
  const chatRef = (id) => db.doc(`cases/${caseCode}/chats/${id}`);

  function saveChat(chat) {
    const body = {
      title: chat.title, createdAt: chat.createdAt, updatedAt: Date.now(), author: chat.author,
      mode: chat.mode, messages: chat.messages, contextMerged: false,
    };
    chat.contextMerged = false;
    return persist(async () => {
      if (created.has(chat.id)) await chatRef(chat.id).update(body);
      else { await chatRef(chat.id).set(body); created.add(chat.id); }
    });
  }

  // ---------- Areas ----------
  function areas() {
    return [...new Set(library.map((c) => c.card.area))].sort((a, b) => a.localeCompare(b));
  }
  function areaColour(area) {
    const i = Math.max(0, areas().indexOf(area));
    return `var(--area-${(i % AREA_COLOURS) + 1})`;
  }
  const sortedLibrary = () => [...library].sort((a, b) => a.card.area.localeCompare(b.card.area) || a.name.localeCompare(b.name));

  // ---------- Rendering: shared ----------
  function setBanner(text) { els.banner.textContent = text; els.banner.hidden = !text; }

  function topTitle() {
    if (view === "card" || (view === "context" && mode === "ask")) return libraryCase(view === "card" ? focusCode : contextCode)?.name || "Brian Ask";
    if (mode === "ask") return "Brian Ask";
    if (view === "chat") return currentChat()?.title || caseCode;
    return caseCode || "Get asked";
  }

  function renderSidebar() {
    const ask = mode === "ask";
    els.modeAsk.setAttribute("aria-selected", String(ask));
    els.modeInterview.setAttribute("aria-selected", String(!ask));
    els.askSide.hidden = !ask;
    els.interviewSide.hidden = ask;
    els.newAsk.disabled = !!streaming;
    if (ask) renderCaseList(); else renderInterviewList();
  }

  function renderCaseList() {
    els.caseList.replaceChildren();
    if (!libraryLoaded) {
      els.caseList.append(el("li", "empty-list", libraryError ? "Couldn't load the cases" : "Loading cases…"));
      return;
    }
    if (!library.length) { els.caseList.append(el("li", "empty-list", "No cases on file yet")); return; }
    for (const c of sortedLibrary()) {
      const li = el("li", "chat-item" + (view === "card" && focusCode === c.code ? " active" : ""));
      const b = button("open", null, () => openCard(c.code));
      const t = el("span", "t");
      const dot = el("span", "dot");
      dot.style.setProperty("--area", areaColour(c.card.area));
      t.append(dot, document.createTextNode(c.name));
      b.append(t, el("span", "s", `${c.code} · ${c.card.area}`));
      b.title = c.name;
      li.append(b);
      els.caseList.append(li);
    }
  }

  function renderInterviewList() {
    const open = !!caseDoc;
    els.caseBlock.hidden = !open;
    els.listLabel.hidden = !open;
    els.newChat.disabled = !open || !!streaming || merging;
    els.caseCodeLabel.textContent = caseCode;
    els.caseNameLabel.textContent = caseDoc?.caseName || "";
    els.chatList.replaceChildren();
    if (!open) return;
    const sorted = [...chats].sort((a, b) => b.createdAt - a.createdAt);
    if (!sorted.length) els.chatList.append(el("li", "empty-list", "No interviews yet"));
    for (const chat of sorted) {
      const li = el("li", "chat-item" + (chat.id === currentId && view === "chat" ? " active" : ""));
      if (chat.id === confirmingId) {
        li.classList.add("confirming");
        li.append(
          el("span", "confirm-label", "Delete for the whole team?"),
          button("confirm-btn", "Cancel", () => { confirmingId = null; renderSidebar(); }),
          button("confirm-btn yes", "Delete", () => deleteChat(chat.id)),
        );
        els.chatList.append(li);
        continue;
      }
      const b = button("open", null, () => selectChat(chat.id));
      b.append(el("span", "t", chat.title), el("span", "s",
        (chat.author && chat.author === uid ? "You" : "Team member") + " · " + (chat.contextMerged ? "in case context" : "not yet in context")));
      b.title = chat.title;
      li.append(b);
      if (chat.author && chat.author === uid) {
        const del = button("delete", null, () => { confirmingId = chat.id; renderSidebar(); });
        del.innerHTML = TRASH_SVG;
        del.setAttribute("aria-label", "Delete interview: " + chat.title);
        del.title = "Delete interview";
        li.append(del);
      }
      els.chatList.append(li);
    }
  }

  function messageEl(role, text, files) {
    const row = el("div", "msg " + role);
    if (role !== "user") {
      const av = el("span", "avatar");
      av.innerHTML = LOGO_SVG;
      row.append(av);
    }
    const bubble = el("div", "bubble", text);
    if (files && files.length) bubble.append(el("span", "files", files.map((x) => "Attached: " + x.name).join("\n")));
    row.append(bubble);
    return { row, bubble };
  }

  function renderMain() {
    els.libraryView.hidden = view !== "library";
    els.cardView.hidden = view !== "card";
    els.pickerView.hidden = view !== "picker";
    els.caseView.hidden = view !== "case";
    els.thread.hidden = !["ask", "chat", "context"].includes(view);
    els.composer.hidden = !["library", "card", "ask", "case", "chat"].includes(view);
    els.topTitle.textContent = topTitle();
    if (view === "library") renderLibrary();
    if (view === "card") renderCard();
    if (view === "case") renderCaseView();
    if (["ask", "chat", "context"].includes(view)) renderThread();
    updateComposer();
    autosize();
    renderSidebar();
  }

  // ---------- Rendering: Ask ----------
  function renderLibrary() {
    const n = library.length;
    els.libIntro.textContent = libraryError ||
      (!libraryLoaded ? "Loading the cases on file…"
        : `Context from ${n} closed case${n === 1 ? "" : "s"}, captured in debriefs with their case teams. Ask about one case, get an overview, or describe your new case and Brian finds the relevant ones.`);

    els.areaFilters.replaceChildren();
    if (libraryLoaded && n) {
      const all = button("filter", null, () => { areaFilter = ""; renderLibrary(); });
      all.setAttribute("aria-pressed", String(!areaFilter));
      all.append(document.createTextNode("All areas"), el("span", "n", String(n)));
      els.areaFilters.append(all);
      for (const a of areas()) {
        const f = button("filter", null, () => { areaFilter = areaFilter === a ? "" : a; renderLibrary(); });
        f.style.setProperty("--area", areaColour(a));
        f.setAttribute("aria-pressed", String(areaFilter === a));
        const dot = el("span", "dot");
        f.append(dot, document.createTextNode(a), el("span", "n", String(library.filter((c) => c.card.area === a).length)));
        els.areaFilters.append(f);
      }
    }

    els.cardGrid.replaceChildren();
    if (!libraryLoaded) return;
    if (!n) {
      els.cardGrid.append(el("div", "lib-empty", "No cases on file yet. A case team adds its case by running /brian review <case code> in Claude Code."));
      return;
    }
    for (const c of sortedLibrary().filter((x) => !areaFilter || x.card.area === areaFilter)) els.cardGrid.append(cardEl(c));
  }

  function areaChip(c) {
    const chip = el("span", "area-chip", c.card.area);
    chip.style.setProperty("--area", areaColour(c.card.area));
    return chip;
  }

  function completenessText(c) {
    const { settled, total } = c.card.completeness;
    const q = total ? `${settled} of ${total} questions settled` : "No open questions listed";
    return `${q} · ${c.merged} interview${c.merged === 1 ? "" : "s"}`;
  }

  function meter(c) {
    const { settled, total } = c.card.completeness;
    const m = el("div", "meter");
    m.setAttribute("role", "img");
    m.setAttribute("aria-label", completenessText(c));
    const bar = el("span");
    bar.style.width = (total ? Math.round((settled / total) * 100) : 0) + "%";
    m.append(bar);
    return m;
  }

  function cardEl(c) {
    const card = el("article", "case-card");
    card.style.setProperty("--area", areaColour(c.card.area));
    const top = el("div", "cc-top");
    top.append(areaChip(c), el("span", "cc-period", c.card.period));
    const title = button("cc-title", c.name, () => openCard(c.code));
    const meta = el("p", "cc-meta", [c.card.client, c.card.industry, c.card.geography].filter(Boolean).join(" · "));
    card.append(top, title, meta);
    if (c.card.summary) card.append(el("p", "cc-summary", c.card.summary));
    if (c.card.keyResults.length) {
      const ul = el("ul", "cc-results");
      for (const r of c.card.keyResults.slice(0, 3)) ul.append(el("li", null, r));
      card.append(ul);
    }
    const foot = el("div", "cc-foot");
    const line = el("div", "cc-complete");
    line.append(el("span", null, completenessText(c)), el("span", "cc-code", c.code));
    foot.append(meter(c), line);
    const actions = el("div", "cc-actions");
    actions.append(button("btn", "Details", () => openCard(c.code)), button("btn primary", "Ask about this case", () => askAbout(c.code)));
    card.append(foot, actions);
    return card;
  }

  function detailBlock(title, items, empty) {
    const b = el("section", "detail-block");
    b.append(el("h2", null, title));
    if (items.length) {
      const ul = el("ul");
      for (const i of items) ul.append(el("li", null, i));
      b.append(ul);
    } else b.append(el("p", null, empty));
    return b;
  }

  function renderCard() {
    const c = libraryCase(focusCode);
    els.cardDetail.replaceChildren();
    if (!c) { view = "library"; return renderMain(); }
    const back = button("link-btn back", "← All cases", () => { view = "library"; renderMain(); });

    const head = el("header", "detail-head");
    const row = el("div", "row");
    row.append(areaChip(c), el("span", "cc-code", c.code));
    head.append(row, el("h1", null, c.name));
    const meta = el("div", "detail-meta");
    for (const [k, v] of [["Client", c.card.client], ["Industry", c.card.industry], ["Geography", c.card.geography], ["Period", c.card.period], ["Type", c.card.caseType],
      ["Original files", c.sharepoint ? "linked in SharePoint" : ""]]) {
      if (!v) continue;
      const s = el("span");
      s.append(document.createTextNode(k + ": "), el("b", null, v));
      meta.append(s);
    }
    head.append(meta);

    const parts = [back, head];
    if (c.card.summary) parts.push(el("p", "detail-summary", c.card.summary));

    const grid = el("div", "detail-grid");
    grid.append(
      detailBlock("Key results", c.card.keyResults, "No results recorded yet."),
      detailBlock("Lessons worth reusing", c.card.lessons, "No lessons recorded yet."),
      detailBlock("Documents worth reusing", c.card.documents, "No documents recorded yet."),
    );
    const ask = el("section", "detail-block");
    ask.append(el("h2", null, "Good to ask about"));
    if (c.card.goodToAskAbout.length) {
      const topics = el("div", "topics");
      for (const t of c.card.goodToAskAbout) topics.append(button("topic", t, () => askSend(`On ${c.name} (${c.code}): ${t}?`, c.code)));
      ask.append(topics);
    } else ask.append(el("p", null, "Ask anything; Brian reads the case context first."));
    const comp = el("section", "detail-block completeness");
    comp.append(el("h2", null, "How complete the context is"), meter(c), el("p", null,
      completenessText(c) + (c.contextUpdatedAt ? ` · updated ${day(c.contextUpdatedAt)}` : "")));
    grid.append(ask, comp);
    parts.push(grid);

    const actions = el("div", "detail-actions");
    actions.append(
      button("btn primary", "Ask about this case", () => askAbout(c.code)),
      button("btn", "View full context", () => { contextCode = c.code; view = "context"; renderMain(); }),
      button("btn", "Get interviewed on this case", () => interviewOn(c.code)),
    );
    parts.push(actions);
    els.cardDetail.append(...parts);
  }

  function renderThread() {
    els.threadInner.replaceChildren();
    if (view === "context") return renderContext();
    if (view === "ask") {
      els.threadInner.append(button("link-btn back", "← All cases", () => { view = "library"; renderMain(); }));
      for (const t of askTurns) {
        const { row, bubble } = messageEl(t.role, t.content);
        if (t.looked && t.looked.length) bubble.append(el("span", "looked", "Looked at: " + t.looked.join(" · ")));
        els.threadInner.append(row);
      }
      scrollToBottom(true);
      return;
    }
    const chat = currentChat();
    if (chat) for (const m of chat.messages) els.threadInner.append(messageEl(m.role, m.content, m.files).row);
    scrollToBottom(true);
  }

  function renderContext() {
    const ask = mode === "ask";
    const src = ask ? libraryCase(contextCode) : null;
    const text = ask ? src?.context : caseDoc?.context;
    const updated = ask ? src?.contextUpdatedAt : caseDoc?.contextUpdatedAt;
    const back = button("link-btn back", ask ? "← Back to the case" : "← Back to the case overview",
      () => { view = ask ? "card" : "case"; renderMain(); });
    const head = el("div", "context-head");
    head.append(el("h2", null, "Case context"), el("span", null, updated ? "Last updated " + stamp(updated) : "Not created yet"));
    const doc = el("div", "context-doc", text ||
      "No interview has been merged into this case's context yet. Run a debrief in \"Get asked\" and finish it with \"Finish & update case context\".");
    els.threadInner.append(back, head, doc);
  }

  function renderCaseView() {
    els.caseTitle.textContent = caseDoc.caseName || caseCode;
    const n = chats.length;
    els.caseSummary.textContent = (n ? `${n} earlier interview${n === 1 ? "" : "s"}. ` : "No interviews yet. ") +
      (caseDoc.contextUpdatedAt ? `The case context was last updated on ${day(caseDoc.contextUpdatedAt)}. ` : "") +
      "Brian focuses on what you know that the files and earlier interviews don't. Choose how you want to be asked:";
  }

  function isNearBottom() {
    const t = els.thread;
    return t.scrollHeight - t.scrollTop - t.clientHeight < 80;
  }
  function scrollToBottom(force) {
    if (force || isNearBottom()) els.thread.scrollTop = els.thread.scrollHeight;
  }

  function updateComposer() {
    const ask = mode === "ask";
    const busy = !!streaming || merging;
    const uploading = pending.some((p) => !p.assetId);
    els.sendBtn.hidden = !!streaming;
    els.stopBtn.hidden = !streaming;
    els.input.disabled = sampleBlocked;
    const batch = isBatch();
    els.input.classList.toggle("batch", batch);
    els.input.placeholder = ask
      ? (view === "card" ? "Ask about this case…" : "Ask about past cases, or describe your new case…")
      : (batch ? "Answer by number, in any order. Type or dictate…" : "Message Brian…");
    const ready = !!prompts && (ask ? libraryLoaded && library.length > 0 : !!caseDoc);
    const hasInput = !!els.input.value.trim() || (!ask && pending.length > 0);
    els.sendBtn.disabled = busy || sampleBlocked || !ready || uploading || !hasInput;
    els.startBtn.disabled = busy || sampleBlocked || !prompts;
    els.startBatchBtn.disabled = busy || sampleBlocked || !prompts;
    els.attachBtn.hidden = ask || !assets;
    els.attachBtn.disabled = busy;
    els.suggestions.hidden = !(ask && view === "library" && libraryLoaded && library.length);
    els.composerNote.textContent = ask
      ? "Brian answers from the case contexts and files on file, with your own Claude account."
      : batch
        ? "Dictate with Windows voice typing (Win+H), macOS dictation or your dictation tool. Enter adds a line; Ctrl+Enter sends."
        : "Brian answers with your own Claude account.";

    const chat = !ask && view === "chat" ? currentChat() : null;
    const hasExchange = !!chat && chat.messages.some((m) => m.role === "assistant");
    els.saveBtn.hidden = !downloads || !chat || !chat.messages.length || busy;
    els.finishBtn.hidden = !hasExchange;
    els.finishBtn.disabled = busy || sampleBlocked || !!chat?.contextMerged;
    els.finishBtn.textContent = merging ? "Updating case context…" : (chat?.contextMerged ? "Case context is up to date" : "Finish & update case context");
    const lastReply = chat ? [...chat.messages].reverse().find((m) => m.role === "assistant") : null;
    els.finishBtn.classList.toggle("ready", !!lastReply && lastReply.content.includes("Project knowledge record") && !chat.contextMerged);
    renderChips();
  }

  function renderChips() {
    els.chips.replaceChildren();
    els.chips.hidden = mode === "ask" || !pending.length;
    for (const p of pending) {
      const chip = el("span", "chip" + (p.assetId ? "" : " busy"));
      chip.append(el("span", "n", p.assetId ? `${p.name} (${kb(p.sizeBytes)})` : `Uploading ${p.name}…`));
      if (p.assetId) {
        const x = button("x", "×", () => removePending(p));
        x.setAttribute("aria-label", "Remove " + p.name);
        chip.append(x);
      }
      els.chips.append(chip);
    }
  }

  // Batch interviews take long, often dictated answers: a taller box, and Enter adds a line instead of sending.
  function isBatch() {
    return mode === "interview" && view === "chat" && currentChat()?.mode === "batch";
  }

  function autosize() {
    els.input.style.height = "auto";
    const max = isBatch() ? Math.round(window.innerHeight * 0.5) : 200;
    els.input.style.height = Math.min(els.input.scrollHeight, max) + "px";
  }

  // ---------- Modes and navigation ----------
  function setMode(next) {
    if (mode === next) return;
    if (streaming) streaming.controller.abort();
    mode = next;
    storageSet(MODE_KEY, next);
    pending = [];
    if (next === "ask") view = askTurns.length ? "ask" : "library";
    else view = caseDoc ? (currentId ? "chat" : "case") : "picker";
    renderMain();
    closeSidebar();
    if (view === "picker") els.caseInput.focus();
  }

  function openCard(code) {
    if (streaming) streaming.controller.abort();
    focusCode = code;
    view = "card";
    renderMain();
    closeSidebar();
    els.cardView.scrollTop = 0;
  }

  function askAbout(code) {
    const c = libraryCase(code);
    if (c) askSend(`Brief me on ${c.name} (${c.code}): what was it about, what came out of it, and what can a new team reuse?`, code);
  }

  function interviewOn(code) {
    setMode("interview");
    els.caseInput.value = code;
    openCase(code);
  }

  async function loadLibrary() {
    await dbReady;
    if (!db) {
      libraryError = "Brian can't reach the cases on file in this view. Open this page on claude.ai while signed in.";
      libraryLoaded = false;
      return renderMain();
    }
    try {
      const snap = await db.collection("cases").get();
      library = snap.docs.map((d) => caseFromDoc(d.id, d.data()));
      libraryLoaded = true;
      libraryError = "";
    } catch (err) {
      console.warn("Could not load the cases.", err);
      libraryError = "Brian couldn't load the cases on file. Reload the page to try again.";
    }
    renderMain();
  }

  // ---------- Ask ----------
  function cardsJson() {
    return JSON.stringify(sortedLibrary().map((c) => ({
      code: c.code, name: c.name, ...c.card,
      interviewsMerged: c.merged, contextUpdated: c.contextUpdatedAt ? day(c.contextUpdatedAt) : "",
      originalFilesInSharePoint: !!c.sharepoint,
    })));
  }

  // ---------- Ask: original files in SharePoint, through the viewer's Microsoft 365 connector ----------
  function connectorProblem(e) {
    switch (e && e.code) {
      case "server_not_connected": return "The Microsoft 365 connector isn't connected for you. Add it in claude.ai Settings → Connectors to let Brian open original case files.";
      case "needs_reauth": return "Your Microsoft 365 connector needs to be reconnected in claude.ai Settings → Connectors.";
      case "selection_required": return "Choose which Microsoft 365 connector Brian should use when claude.ai asks.";
      case "not_in_manifest":
      case "approval_required": return "Brian isn't allowed to use your Microsoft 365 connector on this page.";
      case "blocked_by_policy": return "Your organization's policy blocks Brian from reading SharePoint files.";
      default: return "";
    }
  }

  async function readSharePoint(uri, pages, signal) {
    const key = `${uri}#${pages.startPage || ""}-${pages.endPage || ""}`;
    if (spCache.has(key)) return spCache.get(key);
    let result;
    try {
      result = await mcp.callTool(M365, "read_resource", { uri, ...pages }, { signal });
    } catch (e) {
      const problem = connectorProblem(e);
      if (problem) { setBanner(problem); throw new Error(problem); }
      if (e && e.code === "tool_error") throw new Error("SharePoint answered: " + String(e.message || "").slice(0, 400));
      throw new Error("SharePoint couldn't be reached just now (" + (e && e.code || "error") + ").");
    }
    const text = (result.content || []).filter((b) => b && b.type === "text").map((b) => b.text).join("\n")
      || (typeof result.payload === "string" ? result.payload : JSON.stringify(result.payload ?? ""));
    spCache.set(key, text);
    return text;
  }

  function sharePointTools(findCase, note, signal) {
    const location = (c) => {
      if (!c.sharepoint) throw new Error(`No SharePoint location is on file for ${c.code}, so its original files can't be opened. Use its context and file digests.`);
      return c.sharepoint;
    };
    // Paths stay inside the case folder: empty, "." and ".." segments are dropped.
    const clean = (p) => String(p || "").replace(/\\/g, "/").split("/").filter((s) => s && s !== "." && s !== "..").join("/");
    return [
      {
        name: "open_sharepoint_file",
        description: "Read an original file of one case from its SharePoint, as the person asking. path is relative to the case folder, as written in the context and digests (e.g. 04_Analyses/Savings_Baseline_v5.xlsx). Pages: Excel = one worksheet per page; PowerPoint, Word and PDF = document pages. Pass the pages the context or digest points to; without them, pages 1-5 are read. Returns {path, pages, text, nextOffset}; if nextOffset is not null, call again with that offset. A footer in the text says when more pages exist.",
        inputSchema: {
          type: "object",
          properties: {
            code: { type: "string" }, path: { type: "string" },
            startPage: { type: "integer" }, endPage: { type: "integer" }, offset: { type: "integer" },
          },
          required: ["code", "path"],
        },
        execute: async (input) => {
          const c = findCase(input.code);
          const sp = location(c);
          const path = clean(input.path);
          if (!path) throw new Error("Give the file's path relative to the case folder.");
          const start = Math.max(1, Math.floor(Number(input.startPage) || 1));
          const end = Math.max(start, Math.floor(Number(input.endPage) || start + 4));
          note(`${path} (SharePoint, p. ${start}${end > start ? "–" + end : ""})`);
          const text = await readSharePoint(`file:///${sp.driveId}/${sp.folderPath}/${path}`, { startPage: start, endPage: end }, signal);
          return { path, pages: `${start}-${end}`, ...chunk(text, input.offset) };
        },
      },
      {
        name: "list_sharepoint_folder",
        description: "List the files and subfolders of one case's SharePoint folder, or of a subfolder (path relative to the case folder; empty for the top). Use it when you don't know a file's exact path.",
        inputSchema: { type: "object", properties: { code: { type: "string" }, folder: { type: "string" } }, required: ["code"] },
        execute: async (input) => {
          const c = findCase(input.code);
          const sp = location(c);
          const folder = clean(input.folder);
          note(`SharePoint folder ${folder || c.code}`);
          const text = await readSharePoint(`file:///${sp.driveId}/${sp.folderPath}${folder ? "/" + folder : ""}`, {}, signal);
          return { folder: folder || "/", listing: text.replace(/\s*file:\/\/\/\S+/g, "\n").replace(/\n{2,}/g, "\n").trim().slice(0, TOOL_CHUNK) };
        },
      },
    ];
  }

  async function caseFiles(code) {
    if (fileCache.has(code)) return fileCache.get(code);
    const [docs, uploads] = await Promise.all([
      db.collection(`cases/${code}/docs`).get(),
      db.collection(`cases/${code}/files`).get(),
    ]);
    const files = [
      ...docs.docs.map((d) => {
        const x = d.data() || {};
        return { id: d.id, path: str(x.path) || d.id, title: str(x.title) || str(x.path) || d.id, summary: str(x.summary), text: str(x.text) || str(x.summary) };
      }),
      ...uploads.docs.map((d) => {
        const x = d.data() || {};
        const name = str(x.name) || d.id;
        return { id: "upload:" + d.id, path: "Brian/files/" + (str(x.sharepointName) || name), title: name + " (attached in an interview)", summary: str(x.text).slice(0, 300), text: str(x.text) };
      }),
    ];
    fileCache.set(code, files);
    return files;
  }

  function chunk(text, offset) {
    const start = Math.max(0, Math.floor(Number(offset) || 0));
    const end = start + TOOL_CHUNK;
    return { text: text.slice(start, end), nextOffset: end < text.length ? end : null };
  }

  const hasSharePoint = () => !!mcp && library.some((c) => c.sharepoint);

  function askTools(note, signal) {
    const findCase = (raw) => {
      const c = libraryCase(normaliseCode(raw));
      if (!c) throw new Error(`No case with the code ${raw} is on file. Use a code from the case cards.`);
      return c;
    };
    return [
      ...(hasSharePoint() ? sharePointTools(findCase, note, signal) : []),
      {
        name: "get_case_context",
        description: "Read the full case context (context.md) of one case on file: outcomes, lessons, documents, open questions with their status, gaps. Returns {code, text, nextOffset}; if nextOffset is not null, call again with that offset to read on. Read it before answering anything about a case beyond its card.",
        inputSchema: { type: "object", properties: { code: { type: "string", description: "Case code from the case cards" }, offset: { type: "integer" } }, required: ["code"] },
        execute: async (input) => {
          const c = findCase(input.code);
          note("context of " + c.code);
          const text = c.context || ("No interview has been merged into this case's context yet. Open questions from the file review:\n\n" + (c.questions || "(none)"));
          return { code: c.code, ...chunk(text, input.offset) };
        },
      },
      {
        name: "list_case_files",
        description: "List the case files on record for one case: digests written when its SharePoint was reviewed, plus text files attached in interviews. Returns [{id, path, title, summary}]. Use it when the context doesn't answer the question.",
        inputSchema: { type: "object", properties: { code: { type: "string" } }, required: ["code"] },
        execute: async (input) => {
          const c = findCase(input.code);
          note("file list of " + c.code);
          const files = await caseFiles(c.code);
          return files.slice(0, 80).map((f) => ({ id: f.id, path: f.path, title: f.title, summary: f.summary.slice(0, 300) }));
        },
      },
      {
        name: "read_case_file",
        description: "Read one case file digest or attached text file by its id from list_case_files. Returns {path, text, nextOffset}.",
        inputSchema: { type: "object", properties: { code: { type: "string" }, id: { type: "string" }, offset: { type: "integer" } }, required: ["code", "id"] },
        execute: async (input) => {
          const c = findCase(input.code);
          const f = (await caseFiles(c.code)).find((x) => x.id === String(input.id));
          if (!f) throw new Error("No file with that id in this case. Call list_case_files first.");
          note(f.path);
          const text = f.text || `This file has no readable text in Brian (for example a PDF or image attached in an interview). The case team has it in the case SharePoint under ${f.path}.`;
          return { path: f.path, ...chunk(text, input.offset) };
        },
      },
    ];
  }

  // Without page tools: pick the relevant cases first, then answer with their contexts in the prompt.
  async function pickCases(question, signal) {
    const recent = askTurns.slice(-4).map((t) => `${t.role}: ${t.content.slice(0, 600)}`).join("\n");
    const res = await sample.json(
      "Pick the cases on file needed to answer the question below. Reply with only a JSON object {\"codes\": [case codes]}, " +
      "at most 3, most relevant first, or an empty list if the case cards alone answer it (for example an overview).\n\n" +
      `Question: ${question}\n\nEarlier in this conversation:\n${recent || "(nothing)"}\n\n<case_cards>\n${cardsJson()}\n</case_cards>`,
      { modelTier: "quick", cache: false, signal },
    );
    const codes = Array.isArray(res?.codes) ? res.codes : [];
    return codes.map(normaliseCode).filter((c) => libraryCase(c)).slice(0, 3);
  }

  function contextsBlock(codes) {
    if (!codes.length) return "";
    const budget = Math.floor(60000 / codes.length);
    return "<case_contexts>\n" + codes.map((code) => {
      const c = libraryCase(code);
      return `<case code="${code}">\n${(c.context || "(no interview merged yet)\n" + c.questions).slice(0, budget)}\n</case>`;
    }).join("\n") + "\n</case_contexts>";
  }

  async function askSend(text, code) {
    text = String(text || "").trim();
    if (!text || streaming || sampleBlocked || !prompts || !libraryLoaded) return;
    if (!sample) return setBanner("Brian can only answer inside Claude. Open this page on claude.ai or in the Claude app.");
    if (code) focusCode = code;
    askTurns.push({ role: "user", content: text });
    els.input.value = "";
    autosize();
    view = "ask";
    renderMain();
    closeSidebar();

    const { row, bubble } = messageEl("assistant", "");
    const textNode = el("span", "thinking", "Thinking…");
    const cursor = el("span", "cursor");
    const looked = [];
    const lookedEl = el("span", "looked");
    lookedEl.hidden = true;
    bubble.append(textNode, cursor, lookedEl);
    els.threadInner.append(row);
    scrollToBottom(true);

    const controller = new AbortController();
    streaming = { kind: "ask", controller };
    updateComposer();
    renderSidebar();

    const note = (what) => {
      if (!looked.includes(what)) looked.push(what);
      lookedEl.textContent = "Looked at: " + looked.join(" · ");
      lookedEl.hidden = false;
      if (textNode.classList.contains("thinking")) textNode.textContent = "Reading the " + what + "…";
    };

    let reply = "";
    let errorMessage = null;
    try {
      const useTools = !!sampleLimits?.tools;
      let block = "";
      if (!useTools) {
        textNode.textContent = "Choosing the relevant cases…";
        const codes = await pickCases(text, controller.signal);
        codes.forEach((c) => note("context of " + c));
        block = contextsBlock(codes);
      }
      const focus = libraryCase(focusCode);
      const rules = fill(prompts.ask, {
        TODAY: day(Date.now()),
        FOCUS: focus ? `The person last opened the case ${focus.name} (${focus.code}). A question that names no case is probably about this one.` : "",
        TOOLS_NOTE: useTools
          ? "Tools: get_case_context(code) reads a case's full context in parts; list_case_files(code) lists digests of its files and files attached in interviews; read_case_file(code, id) reads one. Read only what the question needs: usually one or a few contexts, and at most a few files." +
            (hasSharePoint()
              ? "\nOriginal files: for cases whose card says originalFilesInSharePoint, open_sharepoint_file(code, path, startPage, endPage) reads the actual file from the case SharePoint, as the person asking, and list_sharepoint_folder(code, folder) lists a folder. Use them only when the context and digests don't answer the question, for example for detail behind a figure, a specific slide or a worksheet. Let the context and digests guide you to the right file and the right pages, slides or sheets, and read only those. Cite the file and the page or sheet, for example [DEMO-LIGHTHOUSE, file 07_Final_Report/Lighthouse_Final_Report_FINAL.pptx, p. 13]. If a file can't be opened (no access, not found, connector missing), say so and answer from what is on file."
              : "")
          : "The contexts of the cases most likely to matter are included in <case_contexts>. You cannot open case files in this view; if the answer depends on one, name the file to look at.",
        CASE_CARDS: cardsJson(),
        CASE_CONTEXTS: block,
      });
      const turns = askTurns.map((t) => ({ role: t.role, content: t.content }));
      let size = rules.length + turns.reduce((n, t) => n + t.content.length, 0);
      while (turns.length > 1 && size > MAX_INPUT_CHARS) size -= turns.shift().content.length;
      while (turns.length && turns[0].role !== "user") turns.shift();
      const opts = {
        model: MODEL, modelTier: "default", cache: false, signal: controller.signal,
        onText: ({ text: whole }) => {
          reply = whole;
          textNode.className = "";
          textNode.textContent = whole;
          scrollToBottom(false);
        },
      };
      if (useTools) opts.tools = askTools(note, controller.signal);
      const result = await sample([{ role: "user", content: rules }, ...turns], opts);
      reply = result.text;
    } catch (e) {
      reply = e && e.code === "refused" ? "" : (e && typeof e.text === "string" ? e.text : reply);
      errorMessage = handleSampleError(e);
    } finally {
      cursor.remove();
      streaming = null;
    }

    if (reply.trim()) {
      textNode.className = "";
      textNode.textContent = reply;
      askTurns.push({ role: "assistant", content: reply, looked });
    } else {
      row.remove();
    }
    if (errorMessage && view === "ask") {
      els.threadInner.append(messageEl("error", errorMessage).row);
      scrollToBottom(true);
    }
    updateComposer();
    renderSidebar();
  }

  // ---------- Get asked: cases ----------
  async function openCase(raw) {
    els.caseError.hidden = true;
    const code = normaliseCode(raw);
    if (!code) return showCaseError("Enter a case code using letters, digits and dashes.");
    els.openCaseBtn.disabled = true;
    await dbReady;
    try {
      if (!db) return showCaseError("Brian can't reach the case data in this view. Open this page on claude.ai while signed in.");
      const snap = await db.doc("cases/" + code).get();
      if (!snap.exists) {
        return showCaseError(`No case with the code ${code} is set up in Brian yet. Ask the case team to run "/brian review ${code}" in Claude Code.`);
      }
      const chatsSnap = await db.collection(`cases/${code}/chats`).get();
      caseCode = code;
      caseDoc = { ...snap.data() };
      chats = chatsSnap.docs.map((d) => cleanChat(d.id, d.data())).filter(Boolean);
      created.clear();
      chats.forEach((c) => created.add(c.id));
      currentId = null;
      pending = [];
      view = "case";
      storageSet(LAST_CASE_KEY, code);
      renderMain();
    } catch (err) {
      console.warn("Could not open case.", err);
      showCaseError("Brian couldn't load this case just now. Try again in a moment.");
    } finally {
      els.openCaseBtn.disabled = false;
    }
  }

  function showCaseError(text) {
    els.caseError.textContent = text;
    els.caseError.hidden = false;
  }

  function changeCase() {
    if (streaming) streaming.controller.abort();
    caseCode = ""; caseDoc = null; chats = []; currentId = null; pending = [];
    view = "picker";
    els.caseInput.value = storageGet(LAST_CASE_KEY);
    renderMain();
    closeSidebar();
    els.caseInput.focus();
  }

  // ---------- Get asked: interviews ----------
  function selectChat(id) {
    if (streaming) streaming.controller.abort();
    currentId = id;
    confirmingId = null;
    view = id ? "chat" : "case";
    renderMain();
    closeSidebar();
    if (!sampleBlocked) els.input.focus();
  }

  function deleteChat(id) {
    if (streaming && streaming.chatId === id) streaming.controller.abort();
    chats = chats.filter((c) => c.id !== id);
    confirmingId = null;
    if (currentId === id) { currentId = null; view = "case"; }
    persist(() => chatRef(id).delete());
    renderMain();
  }

  // Claude sees the interview instructions (with the case's open questions, current context and the
  // elapsed time) as a leading turn, then the conversation, with attached files described and small
  // text files given in full.
  function turnText(m) {
    let text = m.content;
    for (const f of m.files || []) {
      if (f.inline) text += `\n\n[Attached file: ${f.name}]\n<<<\n${f.inline}\n>>>`;
      else if (f.contentType.startsWith("image/")) text += `\n\n[Attached image: ${f.name}]`;
      else text += `\n\n[Attached file: ${f.name} (${f.contentType || "file"}, ${kb(f.sizeBytes)}). It was received and saved with the case, but you cannot read its content in this chat.]`;
    }
    return text.trim() || "(no text)";
  }

  function elapsedText(chat) {
    const started = chat.messages[0]?.at || chat.createdAt || Date.now();
    const mins = Math.max(0, Math.round((Date.now() - started) / 60000));
    return `${mins} minute${mins === 1 ? "" : "s"} since the interview started (it is now ${hhmm(Date.now())}).`;
  }

  function buildInput(chat) {
    const rules = fill(prompts.interview, {
      CASE_CODE: caseCode,
      CASE_NAME: caseDoc.caseName || caseCode,
      INTERVIEW_NUMBER: chats.filter((c) => c.createdAt <= chat.createdAt).length,
      MODE: MODE_TEXT[chat.mode] || MODE_TEXT.step,
      ELAPSED: elapsedText(chat),
      CASE_CONTEXT: caseDoc.context || "(empty: no interview has been merged yet)",
      OPEN_QUESTIONS: caseDoc.questions || "(no open questions file)",
    });
    const turns = chat.messages.map((m) => ({ role: m.role, content: turnText(m) }));
    let size = rules.length + turns.reduce((n, t) => n + t.content.length, 0);
    while (turns.length > 1 && size > MAX_INPUT_CHARS) size -= turns.shift().content.length;
    while (turns.length && turns[0].role !== "user") turns.shift();
    return [{ role: "user", content: rules }, ...turns];
  }

  function errorCopy(code) {
    switch (code) {
      case "not_granted": return "Brian isn't allowed to use Claude in this view. Reload the page to be asked again.";
      case "sampling_disabled": return "Claude isn't available for your account here.";
      case "not_declared":
      case "capability_disabled":
      case "capability_removed": return "Claude isn't available in this view of the page.";
      case "rate_limited": return "You've reached a usage or rate limit. Wait a little, then try again.";
      case "session_expired": return "Your Claude session expired. Sign in again and reload the page.";
      case "refused": return "Brian can't help with that request.";
      case "prompt_too_large": return "This conversation has grown too long. Start a new one.";
      case "empty_completion": return "Brian didn't write a reply. Try rephrasing your message.";
      case "images_unavailable": return "Images can't be sent to Claude in this view. The file is still saved to the case.";
      case "tools_unavailable": return "Brian can't open case files in this view. Reload the page and try again.";
      case "invalid_json": return "Brian couldn't pick the relevant cases. Try asking again.";
      default: return "Brian couldn't reach Claude just now. Try again.";
    }
  }

  function handleSampleError(e) {
    const code = e && e.code;
    if (PERMANENT_ERRORS.has(code)) {
      sampleBlocked = true;
      setBanner(errorCopy(code));
    }
    return code === "cancelled" ? null : errorCopy(code);
  }

  async function send() {
    const text = els.input.value.trim();
    if ((!text && !pending.length) || streaming || merging || sampleBlocked || !prompts || !caseDoc) return;
    if (pending.some((p) => !p.assetId)) return;
    if (!sample) return setBanner("Brian can only answer inside Claude. Open this page on claude.ai or in the Claude app.");

    let chat = currentChat();
    if (!chat) {
      const now = Date.now();
      chat = {
        id: newId(), createdAt: now, author: uid || "", mode: startMode, contextMerged: false, messages: [],
        title: (startMode === "batch" ? "All at once · " : "Interview · ") +
          new Date(now).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }),
      };
      startMode = "step";
      chats.push(chat);
      currentId = chat.id;
    }
    const files = pending.map((p) => ({ name: p.name, assetId: p.assetId, contentType: p.contentType, sizeBytes: p.sizeBytes, inline: p.inline || "" }));
    const images = pending.filter((p) => p.blob).map((p) => p.blob);
    pending = [];
    chat.messages.push({ role: "user", content: text, at: Date.now(), files });
    saveChat(chat);
    for (const f of files) {
      persist(() => db.doc(`cases/${caseCode}/files/${f.assetId}`).set({
        name: f.name, contentType: f.contentType, sizeBytes: f.sizeBytes, chatId: chat.id,
        uploadedAt: Date.now(), uploadedBy: uid || "", text: f.inline || "",
      }));
    }
    fileCache.delete(caseCode);

    els.input.value = "";
    autosize();
    view = "chat";
    renderMain();

    const { row, bubble } = messageEl("assistant", "");
    const textNode = el("span", "thinking", "Thinking…");
    const cursor = el("span", "cursor");
    bubble.append(textNode, cursor);
    els.threadInner.append(row);
    scrollToBottom(true);

    const controller = new AbortController();
    streaming = { kind: "interview", controller, chatId: chat.id };
    updateComposer();
    renderSidebar();

    let reply = "";
    let errorMessage = null;
    let note = null;
    const opts = {
      model: MODEL, modelTier: "default", cache: false, signal: controller.signal,
      onText: ({ text: whole }) => {
        reply = whole;
        textNode.className = "";
        textNode.textContent = whole;
        scrollToBottom(false);
      },
    };
    if (images.length && sampleLimits?.images) opts.images = images.slice(0, sampleLimits.images.maxCount);
    try {
      const result = await sample(buildInput(chat), opts);
      reply = result.text;
      if (result.truncated) note = "Brian's reply was cut short. Ask for less at a time.";
    } catch (e) {
      reply = e && e.code === "refused" ? "" : (e && typeof e.text === "string" ? e.text : reply);
      errorMessage = handleSampleError(e);
    } finally {
      cursor.remove();
      streaming = null;
    }

    const target = chats.find((c) => c.id === chat.id);
    if (reply.trim() && target) {
      textNode.textContent = reply;
      textNode.className = "";
      target.messages.push({ role: "assistant", content: reply, at: Date.now(), files: [] });
      saveChat(target);
    } else {
      row.remove();
    }
    const shown = errorMessage || note;
    if (shown && currentId === chat.id && view === "chat") {
      els.threadInner.append(messageEl("error", shown).row);
      scrollToBottom(true);
    }
    updateComposer();
    renderSidebar();
  }

  // ---------- Get asked: case context and card ----------
  function transcriptBody(chat) {
    const out = [];
    for (const m of chat.messages) {
      out.push(`[${m.role === "user" ? "Interviewee" : "Brian"}]${m.at ? " " + stamp(m.at) : ""}`);
      out.push(m.content || "(no text)");
      for (const f of m.files || []) out.push(`Attached: ${f.name} (asset ${f.assetId})`);
      out.push("");
    }
    return out.join("\n");
  }

  async function finishChat() {
    const chat = currentChat();
    if (!chat || streaming || merging || sampleBlocked || !sample || !prompts) return;
    merging = true;
    updateComposer();
    renderSidebar();
    const status = messageEl("status", "Merging this interview into the case context…");
    els.threadInner.append(status.row);
    scrollToBottom(true);
    let outcome;
    try {
      await writeChain;                                         // make sure the interview itself is saved first
      const fresh = await db.doc("cases/" + caseCode).get();
      const current = fresh.exists ? fresh.data() : {};
      const merged = new Set(Array.isArray(current.mergedChats) ? current.mergedChats : []);
      merged.add(chat.id);
      const prompt = fill(prompts.context, {
        CASE_CODE: caseCode,
        CASE_NAME: current.caseName || caseCode,
        TODAY: day(Date.now()),
        INTERVIEW_ID: shortId(chat.id),
        INTERVIEW_DATE: day(chat.createdAt),
